<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplikasi To-Do List - Modul 5</title>

    <!-- Koneksi ke CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="todo-app">
        <h2>Daftar Tugas Saya</h2>
        <p class="task-summary" id="task-summary" aria-live="polite"></p>

        <!-- Form untuk menambahkan tugas -->
        <form id="todo-form">
            <div class="input-section">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Ketikkan tugas baru Anda..."
                    autocomplete="off"
                    aria-label="Masukkan tugas baru"
                    required
                >

                <button type="submit" class="add-btn">
                    Tambah
                </button>
            </div>

            <!-- Pesan validasi input -->
            <div
                class="error-message"
                id="inputError"
                role="alert"
                aria-live="polite"
            >
                Tugas tidak boleh kosong atau kurang dari 3 karakter!
            </div>
            <div
                class="error-message"
                id="taskLimitError"
                role="alert"
                aria-live="polite"
            >
                Tugas maksimal 5
            </div>
        </form>

        <!-- Daftar tugas yang ditambahkan -->
        <ul class="todo-list" id="todo-list"></ul>
        <button type="button" class="clear-completed-btn" id="clear-completed-btn">
            Bersihkan Tugas Selesai
        </button>
    </main>

    <!-- Koneksi ke JavaScript -->
    <script src="script.js"></script>

</body>
</html>
